# Job opcional (plan cierre calidad §8.1.4): triage + publicación + ledger sin cambiar el marcador global local.
# Si el repo git está en la carpeta padre, ajustá `working-directory` o mové este archivo a la raíz del monorepo.
name: pytest focused (triage + publication)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "paper_pipeline/hypervisor/**"
      - "paper_pipeline/publication/**"
      - "paper_pipeline/ledger/**"
      - "paper_pipeline/evidence/**"
      - "paper_pipeline/agent_eval/**"
      - "paper_pipeline/reporting/appendix_export.py"
      - "paper_pipeline/reporting/benchmark_bundle.py"
      - "paper_pipeline/reporting/preprint_figures.py"
      - "paper_pipeline/reporting/abstract_audit.py"
      - "paper_pipeline/validation/claim_extractor.py"
      - "examples/baselines/**"
      - "examples/safety_usecase/**"
      - "scripts/safety_usecase_repro.py"
      - "scripts/generate_preprint_figures.py"
      - "scripts/audit_abstract_numbers.py"
      - "paper_pipeline/agent/perplexity_strategy.py"
      - "paper_pipeline/agent/goals.py"
      - "paper_pipeline/agent/strategic_memory.py"
      - "paper_pipeline/agent/goal_selection.py"
      - "paper_pipeline/pipeline/perplexity_phase.py"
      - "tests/test_triage_*.py"
      - "tests/test_publication_*.py"
      - "tests/test_ledger_merge.py"
      - "tests/test_agent_eval_runner.py"
      - "tests/test_agent_eval_baseline.py"
      - "tests/test_safety_usecase_repro.py"
      - "tests/test_appendix_export.py"
      - "tests/test_benchmark_bundle.py"
      - "tests/test_preprint_figures.py"
      - "tests/test_audit_abstract_numbers.py"
      - "tests/test_docs_assets.py"
      - "docs/assets/**"
      - "tests/test_perplexity_strategy.py"
      - "tests/test_goals_manager.py"
      - "tests/test_strategic_memory.py"
      - "tests/test_goal_selection.py"

jobs:
  focused:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Triage + publication + ledger + agent eval + perplexity strategy
        run: >
          python -m pytest
          tests/test_triage_metrics_validation.py
          tests/test_publication_signals.py
          tests/test_publication_packs.py
          tests/test_ledger_merge.py
          tests/test_agent_eval_runner.py
          tests/test_agent_eval_baseline.py
          tests/test_safety_usecase_repro.py
          tests/test_appendix_export.py
          tests/test_benchmark_bundle.py
          tests/test_preprint_figures.py
          tests/test_audit_abstract_numbers.py
          tests/test_docs_assets.py
          tests/test_perplexity_strategy.py
          tests/test_goals_manager.py
          tests/test_strategic_memory.py
          tests/test_goal_selection.py
          -q
