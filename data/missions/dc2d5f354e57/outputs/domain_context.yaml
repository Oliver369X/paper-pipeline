- description: BalancedSubnet implementations in PyTorch often fail due to numerical
    instability, improper masking, and hyperparameter issues during score-based weight
    dropping. These pitfalls stem from the method's reliance on learnable scores for
    per-layer top-k pruning combined with weighted losses on mixed memorized/random
    sequences.[1](https://www.stat.berkeley.edu/~mmahoney/pubs/12369_Mitigating_Memorization_.pdf)[2](https://mansisak.com/memorization/)
  source_paper: ''
  symptom: ''
  fix: ''
- description: "## NaN Loss During Training\nLoss becomes NaN after a few epochs or\
    \ batches.  \nRoot cause: Gradients explode from improper initialization of scores\
    \ (e.g., not using Kaiming uniform), high learning rates on scores optimizer,\
    \ or NaN propagation in loss masking when sequences have invalid tokens.[2](https://mansisak.com/memorization/)[3](https://github.com/pytorch/pytorch/issues/40497)\n\
    Verified fix: Initialize scores with `nn.init.kaiming_uniform_` as per pseudocode;\
    \ use AdamW optimizer with eps=1e-4 and clip gradients (torch.nn.utils.clip_grad_norm_(scores,\
    \ max_norm=1.0)); check and filter NaNs in data batches before loss computation.[1](https://www.stat.berkeley.edu/~mmahoney/pubs/12369_Mitigating_Memorization_.pdf)[2](https://mansisak.com/memorization/)"
