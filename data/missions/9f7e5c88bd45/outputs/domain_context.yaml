- name: docs/index.md
  github_url: https://github.com/tensorflow/kfac/blob/master/docs/index.md
  key_design_decisions:
  - '**URL:** https://github.com/tensorflow/kfac[6](https://github.com/tensorflow/kfac/blob/master/docs/index.md)'
  - Integrated K‑FAC directly into TensorFlow/Keras, so curvature approximation and
    optimization can run end‑to‑end with standard tf.keras workflows.[7](https://github.com/tensorflow/kfac/blob/master/kfac/python/keras/README.md)[6](https://github.com/tensorflow/kfac/blob/master/docs/index.md)
  - Uses a block‑diagonal approximation of the Fisher per layer, with Kronecker‑factored
    blocks for dense and conv layers, enabling fast preconditioning while still capturing
    directional curvature.[8](https://www.cs.toronto.edu/~jmartens/docs/K-FAC_ICML.pdf)[6](https://github.com/tensorflow/kfac/blob/master/docs/index.md)
  - Focused on training acceleration, not explicitly on memorization analysis; using
    it for curvature‑based editing requires extra code outside the repo.[6](https://github.com/tensorflow/kfac/blob/master/docs/index.md)
  - API is somewhat frozen; newer transformer‑style layers (e.g., custom attention
    modules) may need ad hoc “layer_collection” wiring.[5](https://supercomputersfordl2017.github.io/Presentations/K-FAC.pdf)[6](https://github.com/tensorflow/kfac/blob/master/docs/index.md)
  what_not_to_copy: []
- name: keras/README.md
  github_url: https://github.com/tensorflow/kfac/blob/master/kfac/python/keras/README.md
  key_design_decisions:
  - Integrated K‑FAC directly into TensorFlow/Keras, so curvature approximation and
    optimization can run end‑to‑end with standard tf.keras workflows.[7](https://github.com/tensorflow/kfac/blob/master/kfac/python/keras/README.md)[6](https://github.com/tensorflow/kfac/blob/master/docs/index.md)
  - Includes helper utilities for saving and loading models with K‑FAC‑specific optimizer
    state, which is useful if you want to later analyze the curvature‑aware training
    trajectory.[7](https://github.com/tensorflow/kfac/blob/master/kfac/python/keras/README.md)
  what_not_to_copy: []
