- name: DeepakTatachar/Privacy-Memorization-Curvature
  github_url: https://github.com/DeepakTatachar/Privacy-Memorization-Curvature
  key_design_decisions:
  - '**URL:** https://github.com/DeepakTatachar/Privacy-Memorization-Curvature[9](https://github.com/DeepakTatachar/Privacy-Memorization-Curvature)'
  - Implements input‑wise loss‑curvature analysis and explicitly links curvature to
    memorization and privacy risk, which is a close conceptual sibling to K‑FAC‑based
    memorization‑mitigation.[9](https://github.com/DeepakTatachar/Privacy-Memorization-Curvature)
  - Builds on top of standard optimizers but records per‑sample curvature statistics,
    enabling identification of “high‑memory” vs “generalization” examples using curvature‑like
    signals.[9](https://github.com/DeepakTatachar/Privacy-Memorization-Curvature)
