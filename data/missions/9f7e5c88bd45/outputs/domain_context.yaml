topic: Curvatura de Pérdida K-FAC para la Mitigación de Memorización en SLMs
venue_target: arXiv:2510.24256
sota_techniques:
- '**From Memorization to Reasoning in the Spectrum of Loss Curvature**'
- '**Authors, year:** Jack Merullo et al., 2025.[2](https://arxiv.org/abs/2510.24256)[1](https://arxiv.org/html/2510.24256v2)'
- '**Key technical finding:** Shows that in transformers, low‑curvature directions
  in a K‑FAC Fisher basis are predominantly responsible for verbatim memorization,
  while higher‑curvature directions encode generalization and reasoning; editing away
  low‑curvature components suppresses memorization in LMs and ViTs with minimal perplexity/accuracy
  loss.[5](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)[6](https://www.themoonlight.io/ko/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)[1](https://arxiv.org/html/2510.24256v2)'
- '**Main mathematical contribution:**'
- Uses Kronecker‑Factored Approximate Curvature to approximate each weight block’s
  Fisher $$F_W \approx G \otimes A$$, where $$A = \mathbb{E}[aa^\top]$$ (activation
  covariance) and $$G = \mathbb{E}[gg^\top]$$ (gradient covariance).[6](https://www.themoonlight.io/ko/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)[5](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)
- Defines a curvature eigenbasis via eigendecompositions of $$A$$ and $$G$$; eigenvalues
  of $$F_W$$ are $$\lambda_i \mu_j$$, eigenvectors are $$u_i \otimes v_j$$, giving
  an ordered curvature spectrum.[5](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)[6](https://www.themoonlight.io/ko/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)
- Introduces “curvature mass” $$\Pi_{ij} = \lambda_i \mu_j$$ and a projection/editing
  operator that keeps only a subset of pairs with cumulative mass above a threshold
  $$\rho$$, effectively zeroing low‑curvature components and yielding a curvature‑compressed
  weight matrix $$W_{\text{pairs}} = \sum_{(i,j)\in S} C_{ij} u_i v_j^\top$$.[1](https://arxiv.org/html/2510.24256v2)[6](https://www.themoonlight.io/ko/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)
- '**K‑FAC‑Based Weight Editing for Memorization Suppression (code release / technical
  report)**'
- '**Authors, year:** Omri Fahn et al., 2025 (Hugging Face project associated with
  the Merullo et al. line of work).[7](https://huggingface.co/datasets/omrifahn/kfac-memorization-code)'
- '**Key technical finding:** Demonstrates a practical K‑FAC‑based pipeline for computing
  Fisher curvature factors and performing low‑curvature pruning on transformer blocks
  to suppress verbatim memorization in LMs, while preserving downstream task performance.[7](https://huggingface.co/datasets/omrifahn/kfac-memorization-code)'
- '**Main mathematical contribution:** Implements the K‑FAC Fisher approximation and
  curvature‑basis editing in code, including numerically stable estimation of $$A$$
  and $$G$$, eigendecomposition, curvature mass thresholding, and reconstruction,
  effectively operationalizing the theory from Merullo et al. into a reusable algorithmic
  framework.[5](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)[7](https://huggingface.co/datasets/omrifahn/kfac-memorization-code)'
- '**Kronecker‑factored Approximate Curvature (KFAC) From Theory to Practice**'
- '**Authors, year:** Arne F. et al., 2025.[8](https://arxiv.org/abs/2507.05127)'
- '**Key technical finding:** Provides a modern tutorial and tested recipes for K‑FAC
  implementations, covering optimization, Bayesian deep learning, influence functions,
  model merging, and other applications; this has quickly become a standard reference
  for using K‑FAC correctly in large‑scale models.[8](https://arxiv.org/abs/2507.05127)'
- '**Main mathematical contribution:**'
mathematical_constraints: []
known_pitfalls:
- description: Training loss or evaluation perplexity jumps to `NaN` or `inf` after
    applying the K‑FAC‑based weight edit.[5](https://stackoverflow.com/questions/75900085/loss-function-giving-nan-in-pytorch)[6](https://stackoverflow.com/questions/71503683/pytorch-loss-is-nan)
  source_paper: ''
  symptom: ''
  fix: ''
- description: Numerical under‑/over‑flow in the K‑FAC approximation (e.g., very small
    or very large eigenvalues of activation/gradient covariances $$A = \mathbb{E}[aa^\top]$$,
    $$G = \mathbb{E}[gg^\top]$$), compounded by inverting ill‑conditioned matrices
    or scaling the eigenvectors incorrectly.[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)[7](https://app.icerm.brown.edu/materials/Slides/sp-s19-w1/The_K-FAC_method_for_neural_network_optimization_%5D_James_Martens,_DeepMind.pdf)
  source_paper: ''
  symptom: ''
  fix: ''
- description: No damping or regularization on the Kronecker‑factored FIM, so the
    reconstructed weight update $$W \leftarrow U_G(C \odot M)U_A^\top$$ blows up along
    low‑curvature directions.[4](https://github.com/Xin-Jing/K-FAC)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)
  source_paper: ''
  symptom: ''
  fix: ''
- description: Add a small damping term $$\lambda I$$ to both $$A$$ and $$G$$ before
    eigendecomposition (e.g., $$\lambda \approx 1e\text{-}5$$–$$1e\text{-}3$$), as
    in standard K‑FAC optimizers.[7](https://app.icerm.brown.edu/materials/Slides/sp-s19-w1/The_K-FAC_method_for_neural_network_optimization_%5D_James_Martens,_DeepMind.pdf)[4](https://github.com/Xin-Jing/K-FAC)
  source_paper: ''
  symptom: ''
  fix: ''
- description: Clip the largest eigenvalues of $$G$$ and $$A$$ (or normalize them)
    so curvature masses $$\Pi_{ij} = \lambda_i \mu_j$$ stay in a reasonable dynamic
    range.[8](https://www.cs.toronto.edu/~jmartens/docs/K-FAC_ICML_Appendices.pdf)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)
  source_paper: ''
  symptom: ''
  fix: ''
- description: Use FP64 (or at least torch‑double) for the K‑FAC statistics and re‑cast
    only the final edited weights back to FP32.[9](https://github.com/pytorch/pytorch/issues/40497?timeline_page=1)[6](https://stackoverflow.com/questions/71503683/pytorch-loss-is-nan)
  source_paper: ''
  symptom: ''
  fix: ''
- description: Memorization metrics (e.g., recall of training quotes or facts) barely
    change despite a large K‑FAC truncation budget $$\rho$$.
  source_paper: ''
  symptom: ''
  fix: ''
- description: Conversely, general‑purpose perplexity or validation accuracy crashes
    even for small $$\rho$$.[3](https://arxiv.org/html/2510.24256v1)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)
  source_paper: ''
  symptom: ''
  fix: ''
- description: 'Incorrectly ranking directions by curvature mass $$\Pi_{ij}$$:'
  source_paper: ''
  symptom: ''
  fix: ''
- description: For memorization supression, the paper explicitly keeps the *highest*
    curvature‑mass components and zeros the *lowest* (flat) ones; reversing this rank
    order will preserve the “memorizing” directions and remove the more general ones.[10](https://aiwithmike.substack.com/p/disentangling-memory-from-reason)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)
  source_paper: ''
  symptom: ''
  fix: ''
- description: Editing the wrong weight matrices (e.g., attention projections instead
    of MLPs) or applying the same truncation fraction to all layers, when the paper
    uses a sweep over which layers and which $$\rho$$ to edit.[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)[3](https://arxiv.org/html/2510.24256v1)
  source_paper: ''
  symptom: ''
  fix: ''
- description: Double‑check that the truncation mask $$M_{ij}$$ is `1` for pairs $$(i,j)$$
    with the *largest* $$\Pi_{ij}$$, and `0` for smallest (flat) directions (Algorithm
    1‑style in the “From Memorization to Reasoning…” paper).[3](https://arxiv.org/html/2510.24256v1)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)
  source_paper: ''
  symptom: ''
  fix: ''
- description: Limit editing to MLP weight matrices $$W$$ in transformer blocks and
    sweep $$\rho$$ per‑layer or per‑block, as in the OLMo‑2 experiments.[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)[3](https://arxiv.org/html/2510.24256v1)
  source_paper: ''
  symptom: ''
  fix: ''
- description: After recomposing $$W_{\text{edited}} = U_G(C \odot M)U_A^\top$$, the
    edited model behaves randomly or performance drops abruptly even when $$\rho \approx
    1.0$$.
  source_paper: ''
  symptom: ''
  fix: ''
- description: Shapes of intermediate tensors in the reconstruction don’t match the
    original $$W$$.[4](https://github.com/Xin-Jing/K-FAC)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)
  source_paper: ''
  symptom: ''
  fix: ''
- description: Sign / normalization mismatch in the eigenvectors from `torch.symeig`
    or `torch.linalg.eigh` (e.g., not normalizing columns of $$U_G, U_A$$ to unit
    norm, or using left‑/right‑ eigenvectors inconsistently).
  source_paper: ''
  symptom: ''
  fix: ''
- description: Not aligning the Kronecker‑factored basis correctly with the tensor
    shape of $$W \in \mathbb{R}^{d_{\text{out}} \times d_{\text{in}}}$$ (e.g., acting
    on reshaped activations instead of the proper $$A, G$$ dimensions).[4](https://github.com/Xin-Jing/K-FAC)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)
  source_paper: ''
  symptom: ''
  fix: ''
- description: After `eigvals_A, U_A = torch.linalg.eigh(A)` and `eigvals_G, U_G =
    torch.linalg.eigh(G)`, ensure each column of $$U_A, U_G$$ is unit norm (they should
    be by definition, but verify numerically).[8](https://www.cs.toronto.edu/~jmartens/docs/K-FAC_ICML_Appendices.pdf)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)
  source_paper: ''
  symptom: ''
  fix: ''
- description: Confirm that $$C = U_G^\top W U_A$$ has the same num‑elements as $$W$$
    and that the Kronecker‑product‑like indexing of $$(i,j)$$ matches the tensor reshaping
    used to compute $$A$$ and $$G$$ from activations and gradients.[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)[4](https://github.com/Xin-Jing/K-FAC)
  source_paper: ''
  symptom: ''
  fix: ''
- description: 'Python exception:'
  source_paper: ''
  symptom: ''
  fix: ''
- description: '`RuntimeError: Given groups=1, weight of size [...]` when computing
    gradients.'
  source_paper: ''
  symptom: Given groups=1, weight of size [
  fix: ''
- description: Shape mismatch when computing $$A = \text{cov}(a)$$ or $$G = \text{cov}(g)$$
    (e.g., `a` is `(batch, seq, d)` but treated as `(batch*d, d)`).[11](https://discuss.pytorch.org/t/losses-end-up-becoming-nan-during-training-how-to-debug-and-fix-them/99291)[12](https://discuss.pytorch.org/t/loss-becomes-nan-after-some-iterations/150431)
  source_paper: ''
  symptom: ''
  fix: ''
- description: 'Poor reshaping of activations and gradients before computing covariances:'
  source_paper: ''
  symptom: ''
  fix: ''
- description: The paper implicitly flattens activations `a` from a tensor of shape
    `(batch, seq, d_in)` into a 2D `(N, d_in)` matrix for $$A$$, and similarly gradients
    `g` into `(N, d_out)` for $$G$$.[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)
  source_paper: ''
  symptom: ''
  fix: ''
- description: Accumulating statistics over too few samples or only one batch, so
    the empirical covariance is rank‑deficient or numerically ill‑conditioned.[1](https://proceedings.mlr.press/v235/garg24a.html)[4](https://github.com/Xin-Jing/K-FAC)
  source_paper: ''
  symptom: ''
  fix: ''
- description: Reshape `a` to `(batch_size * sequence_length, d_in)` and `g` to `(batch_size
    * sequence_length, d_out)` before stacking and computing `A = a.T @ a / N` and
    `G = g.T @ g / N` (with damping).[4](https://github.com/Xin-Jing/K-FAC)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)
  source_paper: ''
  symptom: ''
  fix: ''
- description: Collect statistics over multiple batches (or a dedicated “curvature”
    dataloader) and normalize by the total number of data points.[1](https://proceedings.mlr.press/v235/garg24a.html)[3](https://arxiv.org/html/2510.24256v1)
  source_paper: ''
  symptom: ''
  fix: ''
- description: The K‑FAC‑based curvature estimate is computed on a small “forget set”,
    but the edit generalizes poorly or behaves differently on other data splits.
  source_paper: ''
  symptom: ''
  fix: ''
- description: The model’s behavior becomes unstable when fine‑tuning briefly after
    the edit.[3](https://arxiv.org/html/2510.24256v1)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)
  source_paper: ''
  symptom: ''
  fix: ''
- description: The smoothing over curvature directions assumes that the activation/gradient
    statistics are representative of the full data distribution; using a tiny or biased
    dataset tilts the K‑FAC basis toward those specific memorized examples, not the
    population‑level flatness.[1](https://proceedings.mlr.press/v235/garg24a.html)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)
  source_paper: ''
  symptom: ''
  fix: ''
- description: The paper notes that the model may need a small amount of re‑training
    after the weight edit to recover full expressivity, but this step is often skipped
    or tuned incorrectly.[13](https://news.ycombinator.com/item?id=45845835)[3](https://arxiv.org/html/2510.24256v1)
  source_paper: ''
  symptom: ''
  fix: ''
- description: Compute $$A$$ and $$G$$ over a reasonably large, diverse sample from
    the training / validation set (not just the “forget set”) to approximate the *population*
    curvature.[1](https://proceedings.mlr.press/v235/garg24a.html)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)
  source_paper: ''
  symptom: ''
  fix: ''
- description: After editing, perform a small cleanup training phase (e.g., 1–3 epochs
    with low LR) to stabilize the model; this is explicitly mentioned as a possible
    requirement in the paper.[13](https://news.ycombinator.com/item?id=45845835)[3](https://arxiv.org/html/2510.24256v1)
  source_paper: ''
  symptom: ''
  fix: ''
- description: '`RuntimeError: CUDA out of memory` when computing full K‑FAC activations/gradient
    matrices for large SLMs.'
  source_paper: ''
  symptom: CUDA out of memory` when computing full K‑FAC activations/gradient matrices
    for large SLMs
  fix: ''
- description: Training loop slows down dramatically when computing K‑FAC statistics.[7](https://app.icerm.brown.edu/materials/Slides/sp-s19-w1/The_K-FAC_method_for_neural_network_optimization_%5D_James_Martens,_DeepMind.pdf)[4](https://github.com/Xin-Jing/K-FAC)
  source_paper: ''
  symptom: ''
  fix: ''
- description: Computing dense empirical matrices $$A \in \mathbb{R}^{d_{\text{in}}
    \times d_{\text{in}}}$$ and $$G \in \mathbb{R}^{d_{\text{out}} \times d_{\text{out}}}$$
    for high‑dimensional MLPs (e.g., up to 4×model‑dim) without batching or low‑rank
    approximations.[7](https://app.icerm.brown.edu/materials/Slides/sp-s19-w1/The_K-FAC_method_for_neural_network_optimization_%5D_James_Martens,_DeepMind.pdf)[4](https://github.com/Xin-Jing/K-FAC)
  source_paper: ''
  symptom: ''
  fix: ''
- description: Use approximate, streaming covariances (e.g., online mean and covariance
    updates) instead of materializing the full stacked tensor; many K‑FAC implementations
    process statistics in batches.[7](https://app.icerm.brown.edu/materials/Slides/sp-s19-w1/The_K-FAC_method_for_neural_network_optimization_%5D_James_Martens,_DeepMind.pdf)[4](https://github.com/Xin-Jing/K-FAC)
  source_paper: ''
  symptom: ''
  fix: ''
- description: For very large layers, consider only the top‑$$k$$ eigenvectors of
    $$A$$ and $$G$$ (power‑iteration or randomized SVD) and truncate the K‑FAC basis
    explicitly, matching the paper’s “curvature‑mass fraction” strategy.[14](https://bohrium.dp.tech/paper/arxiv/2411.15002)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)
  source_paper: ''
  symptom: ''
  fix: ''
reference_implementations:
- name: Qualcomm-AI-research/llm-surgeon
  github_url: https://github.com/Qualcomm-AI-research/llm-surgeon
  key_design_decisions:
  - '**URL:** https://github.com/Qualcomm-AI-research/llm-surgeon[3](https://github.com/Qualcomm-AI-research/llm-surgeon)'
  - '**Stars:** ~1.5k–2k+ (as of early 2026)[3](https://github.com/Qualcomm-AI-research/llm-surgeon)'
  - Uses K‑FAC‑style curvature approximations (activations × gradients) to estimate
    per‑layer loss curvature at scale for LLMs.[3](https://github.com/Qualcomm-AI-research/llm-surgeon)
  - Treats curvature as a “mask signal” for which weights to remove (structured, semi‑structured,
    or unstructured pruning), while updating remaining weights to compensate for the
    loss of others, preserving downstream performance.[3](https://github.com/Qualcomm-AI-research/llm-surgeon)
  - Designed explicitly for LLMs (e.g., LLaMA, Mistral), so it handles large‑scale
    transformer shapes and memory‑efficient backprop through K‑FAC‑style blocks.[3](https://github.com/Qualcomm-AI-research/llm-surgeon)
  what_not_to_copy: []
