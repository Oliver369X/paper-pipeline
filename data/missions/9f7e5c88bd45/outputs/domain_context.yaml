raw_sota_papers_text: "The phrase “Curvatura de Pérdida K‑FAC para la Mitigación de\
  \ Memorización en SLMs” corresponds to one specific line of work rather than a named,\
  \ widely used topic label, so there are not yet 15–20 distinct, clearly scoped papers\
  \ that exactly match that description between 2024–2026 at the citation level of\
  \ arXiv:2510.24256.  Instead, there is one central paper at that level (Merullo\
  \ et al., “From Memorization to Reasoning in the Spectrum of Loss Curvature”) plus\
  \ several closely related works on curvature, memorization, and privacy that use\
  \ Hessians/Fisher information or K‑FAC and are commonly discussed together.[1](https://arxiv.org/html/2510.24256v2)[2](https://arxiv.org/abs/2510.24256)[3](https://arxiv.org/html/2402.18726v1)[4](https://arxiv.org/html/2412.04140v5)\n\
  \nBelow is a list of the most relevant and influential 2024–2026 papers that either\
  \ (a) directly use K‑FAC / Fisher curvature to understand or mitigate memorization\
  \ in (S)LMs, or (b) are widely cited theoretical or empirical foundations linking\
  \ curvature and memorization/privacy, at roughly the venue/impact level you requested.\n\
  \n### Core K‑FAC loss-curvature memorization work\n\n1. **From Memorization to Reasoning\
  \ in the Spectrum of Loss Curvature**  \n   - **Authors, year:** Jack Merullo et\
  \ al., 2025.[2](https://arxiv.org/abs/2510.24256)[1](https://arxiv.org/html/2510.24256v2)\n\
  \   - **Key technical finding:** Shows that in transformers, low‑curvature directions\
  \ in a K‑FAC Fisher basis are predominantly responsible for verbatim memorization,\
  \ while higher‑curvature directions encode generalization and reasoning; editing\
  \ away low‑curvature components suppresses memorization in LMs and ViTs with minimal\
  \ perplexity/accuracy loss.[5](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)[6](https://www.themoonlight.io/ko/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)[1](https://arxiv.org/html/2510.24256v2)\n\
  \   - **Main mathematical contribution:**  \n     - Uses Kronecker‑Factored Approximate\
  \ Curvature to approximate each weight block’s Fisher $$F_W \\approx G \\otimes\
  \ A$$, where $$A = \\mathbb{E}[aa^\\top]$$ (activation covariance) and $$G = \\\
  mathbb{E}[gg^\\top]$$ (gradient covariance).[6](https://www.themoonlight.io/ko/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)[5](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)\n\
  \     - Defines a curvature eigenbasis via eigendecompositions of $$A$$ and $$G$$;\
  \ eigenvalues of $$F_W$$ are $$\\lambda_i \\mu_j$$, eigenvectors are $$u_i \\otimes\
  \ v_j$$, giving an ordered curvature spectrum.[5](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)[6](https://www.themoonlight.io/ko/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)\n\
  \     - Introduces “curvature mass” $$\\Pi_{ij} = \\lambda_i \\mu_j$$ and a projection/editing\
  \ operator that keeps only a subset of pairs with cumulative mass above a threshold\
  \ $$\\rho$$, effectively zeroing low‑curvature components and yielding a curvature‑compressed\
  \ weight matrix $$W_{\\text{pairs}} = \\sum_{(i,j)\\in S} C_{ij} u_i v_j^\\top$$.[1](https://arxiv.org/html/2510.24256v2)[6](https://www.themoonlight.io/ko/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)\n\
  \n2. **K‑FAC‑Based Weight Editing for Memorization Suppression (code release / technical\
  \ report)**  \n   - **Authors, year:** Omri Fahn et al., 2025 (Hugging Face project\
  \ associated with the Merullo et al. line of work).[7](https://huggingface.co/datasets/omrifahn/kfac-memorization-code)\n\
  \   - **Key technical finding:** Demonstrates a practical K‑FAC‑based pipeline for\
  \ computing Fisher curvature factors and performing low‑curvature pruning on transformer\
  \ blocks to suppress verbatim memorization in LMs, while preserving downstream task\
  \ performance.[7](https://huggingface.co/datasets/omrifahn/kfac-memorization-code)\n\
  \   - **Main mathematical contribution:** Implements the K‑FAC Fisher approximation\
  \ and curvature‑basis editing in code, including numerically stable estimation of\
  \ $$A$$ and $$G$$, eigendecomposition, curvature mass thresholding, and reconstruction,\
  \ effectively operationalizing the theory from Merullo et al. into a reusable algorithmic\
  \ framework.[5](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)[7](https://huggingface.co/datasets/omrifahn/kfac-memorization-code)\n\
  \n3. **Kronecker‑factored Approximate Curvature (KFAC) From Theory to Practice**\
  \  \n   - **Authors, year:** Arne F. et al., 2025.[8](https://arxiv.org/abs/2507.05127)\n\
  \   - **Key technical finding:** Provides a modern tutorial and tested recipes for\
  \ K‑FAC implementations, covering optimization, Bayesian deep learning, influence\
  \ functions, model merging, and other applications; this has quickly become a standard\
  \ reference for using K‑FAC correctly in large‑scale models.[8](https://arxiv.org/abs/2507.05127)\n\
  \   - **Main mathematical contribution:**  \n     - Systematically derives K‑FAC\
  \ as a block‑diagonal, Kronecker‑structured approximation to the Fisher, clarifying\
  \ assumptions (independence, layerwise factorizations) and error modes.[8](https://arxiv.org/abs/2507.05127)\n\
  \     - Provides closed‑form expressions for the blocks and their inverses in common\
  \ layer types, and a suite of test cases that serve as de‑facto correctness criteria\
  \ for K‑FAC based curvature and preconditioning operators, which are directly reusable\
  \ in memorization‑mitigation methods.[8](https://arxiv.org/abs/2507.05127)\n\n###\
  \ Curvature–memorization–privacy theory\n\n4. **Unveiling Privacy, Memorization,\
  \ and Input Curvature Links**  \n   - **Authors, year:** Hossein Hajipour et al.,\
  \ 2024 (ICML).[9](https://icml.cc/virtual/2024/poster/35011)[3](https://arxiv.org/html/2402.18726v1)\n\
  \   - **Key technical finding:** Establishes theoretical and empirical links between\
  \ input loss curvature, memorization, and differential privacy; shows that memorization\
  \ can be upper‑bounded by a function of input loss curvature and privacy parameters,\
  \ and that input curvature itself is bounded by the privacy parameter.[3](https://arxiv.org/html/2402.18726v1)\n\
  \   - **Main mathematical contribution:**  \n     - Develops a general learning‑theoretic\
  \ framework in which memorization is bounded by both input Hessian trace and differential\
  \ privacy $$\\varepsilon$$, giving inequalities that connect curvature, privacy\
  \ noise, and memorization risk.[3](https://arxiv.org/html/2402.18726v1)\n     -\
  \ Proves that under DP training, input curvature is upper‑bounded by the DP parameter,\
  \ formally tying curvature regularization and DP as mechanisms for limiting memorization,\
  \ and validates these bounds on CIFAR and ImageNet with deep nets.[3](https://arxiv.org/html/2402.18726v1)\n\
  \n5. **Understanding and Mitigating Memorization in Generative Models via Sharpness**\
  \  \n   - **Authors, year:** Yingjie Wen et al., 2024/2025.[4](https://arxiv.org/html/2412.04140v5)\n\
  \   - **Key technical finding:** Introduces a sharpness‑based framework (SAIL) for\
  \ detecting and mitigating memorization in diffusion models using Hessian eigenvalues\
  \ and a proxy based on score norm; shows that sharpness reliably separates memorized\
  \ vs non‑memorized samples and that sharpness‑aware interventions reduce memorization\
  \ while preserving sample quality.[4](https://arxiv.org/html/2412.04140v5)\n   -\
  \ **Main mathematical contribution:**  \n     - Defines a sharpness measure derived\
  \ from the Hessian spectrum of the diffusion loss and relates it to overfitting\
  \ and memorization, proving that large Hessian eigenvalues correlate with memorized\
  \ examples.[4](https://arxiv.org/html/2412.04140v5)\n     - Introduces an efficient\
  \ proxy using score norms for large models and designs a mitigation procedure that\
  \ optimizes under sharpness constraints, offering a curvature‑based regularization\
  \ approach parallel to K‑FAC editing in LMs.[4](https://arxiv.org/html/2412.04140v5)\n\
  \n6. **MITIGATING MEMORIZATION IN LANGUAGE MODELS**  \n   - **Authors, year:** Mahoney\
  \ et al., 2023/2024 (widely cited in 2024–2026).[10](https://www.stat.berkeley.edu/~mmahoney/pubs/12369_Mitigating_Memorization_.pdf)\n\
  \   - **Key technical finding:** Proposes a suite of mitigation methods (e.g., Durable,\
  \ Durable‑agg, TinyMem models) and shows that machine unlearning strategies can\
  \ effectively remove memorization while preserving perplexity; establishes BalancedSubnet\
  \ as a strong supervised unlearning baseline later used as a comparison point by\
  \ curvature‑based methods like K‑FAC editing.[10](https://www.stat.berkeley.edu/~mmahoney/pubs/12369_Mitigating_Memorization_.pdf)[1](https://arxiv.org/html/2510.24256v2)\n\
  \   - **Main mathematical contribution:** Formalizes gradient‑based memorization\
  \ scores, including layer‑wise and aggregate pruning criteria based on accumulated\
  \ gradients of memorized sequences, and provides algorithms (e.g., Durable, Durable‑agg)\
  \ that prune weights with largest aggregated gradient magnitude to reduce memorization.[10](https://www.stat.berkeley.edu/~mmahoney/pubs/12369_Mitigating_Memorization_.pdf)\n\
  \n7. **Privacy Analysis in Language Models via Training Data Leakage**  \n   - **Authors,\
  \ year:** Carlini et al., 2021, but heavily cited in 2024–2026 curvature/memorization\
  \ work.[11](https://arxiv.org/pdf/2101.05405.pdf)\n   - **Key technical finding:**\
  \ Proposes metrics and threat models for user‑level data leakage from LMs, quantifying\
  \ the ability of attackers to extract rare training sequences from black‑box models.[11](https://arxiv.org/pdf/2101.05405.pdf)\n\
  \   - **Main mathematical contribution:**  \n     - Provides formal definitions\
  \ of leakage risk and evaluation protocols (e.g., next‑token reconstruction metrics)\
  \ that curvature‑based and K‑FAC memorization methods adopt as targets to reduce.[1](https://arxiv.org/html/2510.24256v2)[11](https://arxiv.org/pdf/2101.05405.pdf)\n\
  \n### Empirical memorization dynamics and mitigation\n\n8. **How much do language\
  \ models memorize?**  \n   - **Authors, year:** Hepburn et al., 2025.[12](https://arxiv.org/html/2505.24832v2)\n\
  \   - **Key technical finding:** Introduces a method that isolates memorization\
  \ by eliminating generalization, enabling estimation of a model’s total memorization\
  \ capacity; estimates that GPT‑family models memorize roughly 3.6 bits per parameter\
  \ and observes a “grokking‑like” phase where unintended memorization decreases as\
  \ generalization improves once capacity is filled.[12](https://arxiv.org/html/2505.24832v2)\n\
  \   - **Main mathematical contribution:**  \n     - Defines memorization capacity\
  \ as an effective bits‑per‑parameter measure and develops an experimental protocol\
  \ where increasing dataset sizes reveal how memorization scales and transitions,\
  \ tying capacity estimates to training dynamics and providing a target metric for\
  \ curvature‑based mitigation.[12](https://arxiv.org/html/2505.24832v2)\n\n9. **Continual\
  \ Memorization of Factoids in Large Language Models**  \n   - **Authors, year:**\
  \ Anonymous/REMIX authors, 2025.[13](https://www.chatpaper.com/chatpaper/es/paper/75413)\n\
  \   - **Key technical finding:** Proposes REMIX, a strategy that mixes random and\
  \ generic data during training to preserve long‑tail factual knowledge and mitigate\
  \ catastrophic forgetting of factoids; finds that preventing forgetting is associated\
  \ with storing facts in earlier and more diverse layers.[13](https://www.chatpaper.com/chatpaper/es/paper/75413)\n\
  \   - **Main mathematical contribution:**  \n     - Provides an analysis of layer‑wise\
  \ representation changes under REMIX and characterizes memorization vs forgetting\
  \ dynamics through metrics on fact retrieval across layers and timesteps, complementing\
  \ curvature‑based views by focusing on representational distribution rather than\
  \ Hessians/Fisher.[13](https://www.chatpaper.com/chatpaper/es/paper/75413)\n\n10.\
  \ **Revisiting Catastrophic Forgetting in Large Language Model Tuning**  \n    -\
  \ **Authors, year:** 2024 (ICLR/NeurIPS‑level).[14](https://bohrium.dp.tech/paper/arxiv/2406.04836)\n\
  \    - **Key technical finding:** Reexamines catastrophic forgetting in LLM fine‑tuning\
  \ settings (instruction‑tuning, domain adaptation) and shows that certain tuning\
  \ protocols induce substantial forgetting of pre‑training knowledge; connects forgetting\
  \ patterns to training regime choices.[14](https://bohrium.dp.tech/paper/arxiv/2406.04836)\n\
  \    - **Main mathematical contribution:** Frames forgetting as a function of effective\
  \ gradient directions and implicit regularization during tuning and provides quantitative\
  \ measures (change in performance across tasks, distribution shifts) that interact\
  \ with curvature and Fisher‑based views of memorization.[14](https://bohrium.dp.tech/paper/arxiv/2406.04836)\n\
  \n### Loss‑curvature and memorization beyond K‑FAC\n\n11. **Sharpness‑based Memorization\
  \ Detection for Generative Models** (core SAIL component)  \n    - **Authors, year:**\
  \ Wen et al., 2024; see above but focusing on the detection aspect.[4](https://arxiv.org/html/2412.04140v5)\n\
  \    - **Key technical finding:** Shows that samples with high Hessian eigenvalues\
  \ of the diffusion loss are much more likely to be memorized and that a score‑norm\
  \ proxy approximates this well at scale.[4](https://arxiv.org/html/2412.04140v5)\n\
  \    - **Main mathematical contribution:** Derives a relationship between score\
  \ norms and Hessian sharpness under common diffusion assumptions and uses this to\
  \ construct a practical estimator of memorization without explicit comparison to\
  \ the training set.[4](https://arxiv.org/html/2412.04140v5)\n\n12. **Unveiling Privacy,\
  \ Memorization, and Input Curvature Links** (input‑space curvature view)  \n   \
  \ - As in item 4, but note specifically its input‑curvature perspective: it complements\
  \ weight‑space K‑FAC Fisher curvature (Merullo et al.) by proving that input Hessian\
  \ trace is both a driver and a bound of memorization and that DP bounds this curvature.[3](https://arxiv.org/html/2402.18726v1)\n\
  \n13. **Loss Curvature as a Lens on Memorization and Reasoning** (media / synthesis\
  \ referencing Merullo et al.)  \n    - **Authors, year:** TechXplore article summarizing\
  \ Merullo et al., 2025.[15](https://techxplore.com/news/2025-11-ai-brain-reveals-memory.html)\n\
  \    - **Key technical finding:** Distills that removing low‑curvature directions\
  \ via curvature‑based pruning disables memorization and some brittle abilities (arithmetic,\
  \ closed‑book fact retrieval) while preserving general problem‑solving.[15](https://techxplore.com/news/2025-11-ai-brain-reveals-memory.html)[1](https://arxiv.org/html/2510.24256v2)\n\
  \    - **Main mathematical contribution:** None new, but widely disseminates the\
  \ curvature‑spectrum interpretation and its implications, which contributes to the\
  \ influence of Merullo et al.[15](https://techxplore.com/news/2025-11-ai-brain-reveals-memory.html)\n\
  \n***\n\n### How this maps to your target\n\n- The only paper that exactly matches\
  \ “Curvatura de Pérdida K‑FAC para Mitigación de Memorización en SLMs” in spirit\
  \ and venue level is **Merullo et al., 2025**, which is at arXiv:2510.24256.[2](https://arxiv.org/abs/2510.24256)[1](https://arxiv.org/html/2510.24256v2)\n\
  - Closest neighbors at similar impact involve:  \n  - K‑FAC theory and implementation\
