- name: google-deepmind/kfac-jax
  github_url: https://github.com/google-deepmind/kfac-jax
  key_design_decisions:
  - '**URL:** https://github.com/google-deepmind/kfac-jax[4](https://github.com/google-deepmind/kfac-jax)'
  - Implements K‑FAC in JAX with first‑class support for curvature‑aware updates and
    explicit FIM/Hessian approximations, making it a natural fit for curvature‑based
    analysis of memorization.[4](https://github.com/google-deepmind/kfac-jax)
  - Uses JAX’s `vmap`/`pmap` and `jit` to keep K‑FAC curvature computation efficient
    even at large batch sizes, enabling curvature sweeps over many examples.[4](https://github.com/google-deepmind/kfac-jax)
  - 'Designed as a modular library: curvature estimators can be attached to arbitrary
    model modules, not just standard MLPs/convnets, so it can be reused for transformer‑internal
    layers.[4](https://github.com/google-deepmind/kfac-jax)'
  - JAX‑specific API surface; PyTorch users must either port or reimplement the K‑FAC‑style
    logic, which can be nontrivial.[4](https://github.com/google-deepmind/kfac-jax)
  what_not_to_copy: []
