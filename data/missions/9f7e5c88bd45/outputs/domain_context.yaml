raw_pitfalls_text: "Implementing “*Curvatura de Pérdida K‑FAC para la Mitigación de\
  \ Memorización en SLMs*” (i.e., K‑FAC‑based loss‑curvature‑aware weight editing\
  \ for memorization suppression in small language models) in Python / PyTorch is\
  \ numerically delicate; the main failure modes are numerical instability, mismatched\
  \ tensor shapes, and semantic mis‑use of curvature‑ordering. Below are the most\
  \ common pitfalls adapted from the K‑FAC‑for‑curvature‑based unlearning literature\
  \ (e.g., “From Memorization to Reasoning in the Spectrum of Loss Curvature” and\
  \ related work) and the standard K‑FAC codebase, along with concrete fixes.[1](https://proceedings.mlr.press/v235/garg24a.html)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)[3](https://arxiv.org/html/2510.24256v1)[4](https://github.com/Xin-Jing/K-FAC)\n\
  \n***\n\n### 1. **NaN or exploding loss after K‑FAC edit**\n\n**Symptom:**  \n-\
  \ Training loss or evaluation perplexity jumps to `NaN` or `inf` after applying\
  \ the K‑FAC‑based weight edit.[5](https://stackoverflow.com/questions/75900085/loss-function-giving-nan-in-pytorch)[6](https://stackoverflow.com/questions/71503683/pytorch-loss-is-nan)\n\
  \n**Root cause:**  \n- Numerical under‑/over‑flow in the K‑FAC approximation (e.g.,\
  \ very small or very large eigenvalues of activation/gradient covariances $$A =\
  \ \\mathbb{E}[aa^\\top]$$, $$G = \\mathbb{E}[gg^\\top]$$), compounded by inverting\
  \ ill‑conditioned matrices or scaling the eigenvectors incorrectly.[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)[7](https://app.icerm.brown.edu/materials/Slides/sp-s19-w1/The_K-FAC_method_for_neural_network_optimization_%5D_James_Martens,_DeepMind.pdf)\n\
  - No damping or regularization on the Kronecker‑factored FIM, so the reconstructed\
  \ weight update $$W \\leftarrow U_G(C \\odot M)U_A^\\top$$ blows up along low‑curvature\
  \ directions.[4](https://github.com/Xin-Jing/K-FAC)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)\n\
  \n**Verified fix:**  \n- Add a small damping term $$\\lambda I$$ to both $$A$$ and\
  \ $$G$$ before eigendecomposition (e.g., $$\\lambda \\approx 1e\\text{-}5$$–$$1e\\\
  text{-}3$$), as in standard K‑FAC optimizers.[7](https://app.icerm.brown.edu/materials/Slides/sp-s19-w1/The_K-FAC_method_for_neural_network_optimization_%5D_James_Martens,_DeepMind.pdf)[4](https://github.com/Xin-Jing/K-FAC)\n\
  - Clip the largest eigenvalues of $$G$$ and $$A$$ (or normalize them) so curvature\
  \ masses $$\\Pi_{ij} = \\lambda_i \\mu_j$$ stay in a reasonable dynamic range.[8](https://www.cs.toronto.edu/~jmartens/docs/K-FAC_ICML_Appendices.pdf)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)\n\
  - Use FP64 (or at least torch‑double) for the K‑FAC statistics and re‑cast only\
  \ the final edited weights back to FP32.[9](https://github.com/pytorch/pytorch/issues/40497?timeline_page=1)[6](https://stackoverflow.com/questions/71503683/pytorch-loss-is-nan)\n\
  \n***\n\n### 2. **Edited weights still memorize strongly or “forget” generalization**\n\
  \n**Symptom:**  \n- Memorization metrics (e.g., recall of training quotes or facts)\
  \ barely change despite a large K‑FAC truncation budget $$\\rho$$.  \n- Conversely,\
  \ general‑purpose perplexity or validation accuracy crashes even for small $$\\\
  rho$$.[3](https://arxiv.org/html/2510.24256v1)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)\n\
  \n**Root cause:**  \n- Incorrectly ranking directions by curvature mass $$\\Pi_{ij}$$:\
  \  \n  - For memorization supression, the paper explicitly keeps the *highest* curvature‑mass\
  \ components and zeros the *lowest* (flat) ones; reversing this rank order will\
  \ preserve the “memorizing” directions and remove the more general ones.[10](https://aiwithmike.substack.com/p/disentangling-memory-from-reason)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)\n\
  - Editing the wrong weight matrices (e.g., attention projections instead of MLPs)\
  \ or applying the same truncation fraction to all layers, when the paper uses a\
  \ sweep over which layers and which $$\\rho$$ to edit.[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)[3](https://arxiv.org/html/2510.24256v1)\n\
  \n**Verified fix:**  \n- Double‑check that the truncation mask $$M_{ij}$$ is `1`\
  \ for pairs $$(i,j)$$ with the *largest* $$\\Pi_{ij}$$, and `0` for smallest (flat)\
  \ directions (Algorithm 1‑style in the “From Memorization to Reasoning…” paper).[3](https://arxiv.org/html/2510.24256v1)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)\n\
  - Limit editing to MLP weight matrices $$W$$ in transformer blocks and sweep $$\\\
  rho$$ per‑layer or per‑block, as in the OLMo‑2 experiments.[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)[3](https://arxiv.org/html/2510.24256v1)\n\
  \n***\n\n### **3. Incorrect K‑FAC basis: $$U_G^T W U_A$$ reconstruction**\n\n**Symptom:**\
  \  \n- After recomposing $$W_{\\text{edited}} = U_G(C \\odot M)U_A^\\top$$, the\
  \ edited model behaves randomly or performance drops abruptly even when $$\\rho\
  \ \\approx 1.0$$.  \n- Shapes of intermediate tensors in the reconstruction don’t\
  \ match the original $$W$$.[4](https://github.com/Xin-Jing/K-FAC)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)\n\
  \n**Root cause:**  \n- Sign / normalization mismatch in the eigenvectors from `torch.symeig`\
  \ or `torch.linalg.eigh` (e.g., not normalizing columns of $$U_G, U_A$$ to unit\
  \ norm, or using left‑/right‑ eigenvectors inconsistently).  \n- Not aligning the\
  \ Kronecker‑factored basis correctly with the tensor shape of $$W \\in \\mathbb{R}^{d_{\\\
  text{out}} \\times d_{\\text{in}}}$$ (e.g., acting on reshaped activations instead\
  \ of the proper $$A, G$$ dimensions).[4](https://github.com/Xin-Jing/K-FAC)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)\n\
  \n**Verified fix:**  \n- After `eigvals_A, U_A = torch.linalg.eigh(A)` and `eigvals_G,\
  \ U_G = torch.linalg.eigh(G)`, ensure each column of $$U_A, U_G$$ is unit norm (they\
  \ should be by definition, but verify numerically).[8](https://www.cs.toronto.edu/~jmartens/docs/K-FAC_ICML_Appendices.pdf)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)\n\
  - Confirm that $$C = U_G^\\top W U_A$$ has the same num‑elements as $$W$$ and that\
  \ the Kronecker‑product‑like indexing of $$(i,j)$$ matches the tensor reshaping\
  \ used to compute $$A$$ and $$G$$ from activations and gradients.[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)[4](https://github.com/Xin-Jing/K-FAC)\n\
  \n***\n\n### 4. **Gradient / shape errors in K‑FAC statistics collection**\n\n**Symptom:**\
  \  \n- Python exception:  \n  - `RuntimeError: Given groups=1, weight of size [...]`\
  \ when computing gradients.  \n  - Shape mismatch when computing $$A = \\text{cov}(a)$$\
  \ or $$G = \\text{cov}(g)$$ (e.g., `a` is `(batch, seq, d)` but treated as `(batch*d,\
  \ d)`).[11](https://discuss.pytorch.org/t/losses-end-up-becoming-nan-during-training-how-to-debug-and-fix-them/99291)[12](https://discuss.pytorch.org/t/loss-becomes-nan-after-some-iterations/150431)\n\
  \n**Root cause:**  \n- Poor reshaping of activations and gradients before computing\
  \ covariances:  \n  - The paper implicitly flattens activations `a` from a tensor\
  \ of shape `(batch, seq, d_in)` into a 2D `(N, d_in)` matrix for $$A$$, and similarly\
  \ gradients `g` into `(N, d_out)` for $$G$$.[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)\n\
  - Accumulating statistics over too few samples or only one batch, so the empirical\
  \ covariance is rank‑deficient or numerically ill‑conditioned.[1](https://proceedings.mlr.press/v235/garg24a.html)[4](https://github.com/Xin-Jing/K-FAC)\n\
  \n**Verified fix:**  \n- Reshape `a` to `(batch_size * sequence_length, d_in)` and\
  \ `g` to `(batch_size * sequence_length, d_out)` before stacking and computing `A\
  \ = a.T @ a / N` and `G = g.T @ g / N` (with damping).[4](https://github.com/Xin-Jing/K-FAC)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)\n\
  - Collect statistics over multiple batches (or a dedicated “curvature” dataloader)\
  \ and normalize by the total number of data points.[1](https://proceedings.mlr.press/v235/garg24a.html)[3](https://arxiv.org/html/2510.24256v1)\n\
  \n***\n\n### 5. **Inconsistent mode / data handling (e.g., train vs val)**\n\n**Symptom:**\
  \  \n- The K‑FAC‑based curvature estimate is computed on a small “forget set”, but\
  \ the edit generalizes poorly or behaves differently on other data splits.  \n-\
  \ The model’s behavior becomes unstable when fine‑tuning briefly after the edit.[3](https://arxiv.org/html/2510.24256v1)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)\n\
  \n**Root cause:**  \n- The smoothing over curvature directions assumes that the\
  \ activation/gradient statistics are representative of the full data distribution;\
  \ using a tiny or biased dataset tilts the K‑FAC basis toward those specific memorized\
  \ examples, not the population‑level flatness.[1](https://proceedings.mlr.press/v235/garg24a.html)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)\n\
  - The paper notes that the model may need a small amount of re‑training after the\
  \ weight edit to recover full expressivity, but this step is often skipped or tuned\
  \ incorrectly.[13](https://news.ycombinator.com/item?id=45845835)[3](https://arxiv.org/html/2510.24256v1)\n\
  \n**Verified fix:**  \n- Compute $$A$$ and $$G$$ over a reasonably large, diverse\
  \ sample from the training / validation set (not just the “forget set”) to approximate\
  \ the *population* curvature.[1](https://proceedings.mlr.press/v235/garg24a.html)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)\n\
  - After editing, perform a small cleanup training phase (e.g., 1–3 epochs with low\
  \ LR) to stabilize the model; this is explicitly mentioned as a possible requirement\
  \ in the paper.[13](https://news.ycombinator.com/item?id=45845835)[3](https://arxiv.org/html/2510.24256v1)\n\
  \n***\n\n### 6. **Computational overhead and memory explosion**\n\n**Symptom:**\
  \  \n- `RuntimeError: CUDA out of memory` when computing full K‑FAC activations/gradient\
  \ matrices for large SLMs.  \n- Training loop slows down dramatically when computing\
  \ K‑FAC statistics.[7](https://app.icerm.brown.edu/materials/Slides/sp-s19-w1/The_K-FAC_method_for_neural_network_optimization_%5D_James_Martens,_DeepMind.pdf)[4](https://github.com/Xin-Jing/K-FAC)\n\
  \n**Root cause:**  \n- Computing dense empirical matrices $$A \\in \\mathbb{R}^{d_{\\\
  text{in}} \\times d_{\\text{in}}}$$ and $$G \\in \\mathbb{R}^{d_{\\text{out}} \\\
  times d_{\\text{out}}}$$ for high‑dimensional MLPs (e.g., up to 4×model‑dim) without\
  \ batching or low‑rank approximations.[7](https://app.icerm.brown.edu/materials/Slides/sp-s19-w1/The_K-FAC_method_for_neural_network_optimization_%5D_James_Martens,_DeepMind.pdf)[4](https://github.com/Xin-Jing/K-FAC)\n\
  \n**Verified fix:**  \n- Use approximate, streaming covariances (e.g., online mean\
  \ and covariance updates) instead of materializing the full stacked tensor; many\
  \ K‑FAC implementations process statistics in batches.[7](https://app.icerm.brown.edu/materials/Slides/sp-s19-w1/The_K-FAC_method_for_neural_network_optimization_%5D_James_Martens,_DeepMind.pdf)[4](https://github.com/Xin-Jing/K-FAC)\n\
  - For very large layers, consider only the top‑$$k$$ eigenvectors of $$A$$ and $$G$$\
  \ (power‑iteration or randomized SVD) and truncate the K‑FAC basis explicitly, matching\
  \ the paper’s “curvature‑mass fraction” strategy.[14](https://bohrium.dp.tech/paper/arxiv/2411.15002)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)\n\
  \n***\n\nIf you tell me which layer(s) you’re targeting (e.g., MLP‑down proj, attention\
  \ QKV, etc.) and whether you’re using FP16/AMP, I can sketch a concrete PyTorch\
  \ snippet that avoids these specific pitfalls while remaining close to the “From\
  \ Memorization to Reasoning…” protocol."
raw_repos_text: "Several of the most‑used open‑source GitHub repositories relevant\
  \ to “Curvatura de Pérdida K‑FAC para la Mitigación de Memorización en SLMs” (i.e.,\
  \ K‑FAC‑based loss‑curvature methods for mitigating memorization in small/LLMs)\
  \ are frameworks that either implement K‑FAC as a curvature estimator or build weight‑editing/unlearning\
  \ pipelines on top of K‑FAC‑style curvature. Below is a short list of 6 highly relevant,\
  \ actively used repos, with the requested details.[1](https://arxiv.org/html/2510.24256v2)[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)[3](https://github.com/Qualcomm-AI-research/llm-surgeon)\n\
  \n***\n\n### 1. `Qualcomm-AI-research/llm-surgeon` (K‑FAC‑based pruning + unlearning)\
  \  \n- **Name:** llm‑surgeon  \n- **URL:** https://github.com/Qualcomm-AI-research/llm-surgeon[3](https://github.com/Qualcomm-AI-research/llm-surgeon)\n\
  - **Stars:** ~1.5k–2k+ (as of early 2026)[3](https://github.com/Qualcomm-AI-research/llm-surgeon)\n\
  - **Key architectural decisions (state‑of‑the‑art):**  \n  - Uses K‑FAC‑style curvature\
  \ approximations (activations × gradients) to estimate per‑layer loss curvature\
  \ at scale for LLMs.[3](https://github.com/Qualcomm-AI-research/llm-surgeon)\n \
  \ - Treats curvature as a “mask signal” for which weights to remove (structured,\
  \ semi‑structured, or unstructured pruning), while updating remaining weights to\
  \ compensate for the loss of others, preserving downstream performance.[3](https://github.com/Qualcomm-AI-research/llm-surgeon)\n\
  \  - Designed explicitly for LLMs (e.g., LLaMA, Mistral), so it handles large‑scale\
  \ transformer shapes and memory‑efficient backprop through K‑FAC‑style blocks.[3](https://github.com/Qualcomm-AI-research/llm-surgeon)\n\
  - **Anti‑patterns / technical debt:**  \n  - Strong coupling between curvature‑estimation\
  \ and pruning code; swapping to a different curvature estimator (e.g., SVD, Hessian\
  \ free) can require refactoring.[3](https://github.com/Qualcomm-AI-research/llm-surgeon)\n\
  \  - Some modules assume specific model families; porting to non‑decoder‑style architectures\
  \ (e.g., encoder‑decoder) may need significant wiring changes.[3](https://github.com/Qualcomm-AI-research/llm-surgeon)\n\
  \n***\n\n### 2. `google-deepmind/kfac-jax` (Second‑order + curvature estimation\
  \ in JAX)  \n- **Name:** `kfac‑jax`  \n- **URL:** https://github.com/google-deepmind/kfac-jax[4](https://github.com/google-deepmind/kfac-jax)\n\
  - **Stars:** ~1.5k–2k+  \n- **Key architectural decisions (state‑of‑the‑art):**\
  \  \n  - Implements K‑FAC in JAX with first‑class support for curvature‑aware updates\
  \ and explicit FIM/Hessian approximations, making it a natural fit for curvature‑based\
  \ analysis of memorization.[4](https://github.com/google-deepmind/kfac-jax)\n  -\
  \ Uses JAX’s `vmap`/`pmap` and `jit` to keep K‑FAC curvature computation efficient\
  \ even at large batch sizes, enabling curvature sweeps over many examples.[4](https://github.com/google-deepmind/kfac-jax)\n\
  \  - Designed as a modular library: curvature estimators can be attached to arbitrary\
  \ model modules, not just standard MLPs/convnets, so it can be reused for transformer‑internal\
  \ layers.[4](https://github.com/google-deepmind/kfac-jax)\n- **Anti‑patterns / technical\
  \ debt:**  \n  - JAX‑specific API surface; PyTorch users must either port or reimplement\
  \ the K‑FAC‑style logic, which can be nontrivial.[4](https://github.com/google-deepmind/kfac-jax)\n\
  \  - Some builder‑pattern abstractions are verbose; newcomers may struggle with\
  \ the “layer collection” pattern if they only want simple per‑layer FIM blocks.[5](https://supercomputersfordl2017.github.io/Presentations/K-FAC.pdf)[4](https://github.com/google-deepmind/kfac-jax)\n\
  \n***\n\n### 3. `tensorflow/kfac` (Legacy K‑FAC for TensorFlow/Keras)  \n- **Name:**\
  \ `tensorflow/kfac`  \n- **URL:** https://github.com/tensorflow/kfac[6](https://github.com/tensorflow/kfac/blob/master/docs/index.md)\n\
  - **Stars:** ~1k+  \n- **Key architectural decisions (state‑of‑the‑the‑art for its\
  \ era):**  \n  - Integrated K‑FAC directly into TensorFlow/Keras, so curvature approximation\
  \ and optimization can run end‑to‑end with standard tf.keras workflows.[7](https://github.com/tensorflow/kfac/blob/master/kfac/python/keras/README.md)[6](https://github.com/tensorflow/kfac/blob/master/docs/index.md)\n\
  \  - Uses a block‑diagonal approximation of the Fisher per layer, with Kronecker‑factored\
  \ blocks for dense and conv layers, enabling fast preconditioning while still capturing\
  \ directional curvature.[8](https://www.cs.toronto.edu/~jmartens/docs/K-FAC_ICML.pdf)[6](https://github.com/tensorflow/kfac/blob/master/docs/index.md)\n\
  \  - Includes helper utilities for saving and loading models with K‑FAC‑specific\
  \ optimizer state, which is useful if you want to later analyze the curvature‑aware\
  \ training trajectory.[7](https://github.com/tensorflow/kfac/blob/master/kfac/python/keras/README.md)\n\
  - **Anti‑patterns / technical debt:**  \n  - Focused on training acceleration, not\
  \ explicitly on memorization analysis; using it for curvature‑based editing requires\
  \ extra code outside the repo.[6](https://github.com/tensorflow/kfac/blob/master/docs/index.md)\n\
  \  - API is somewhat frozen; newer transformer‑style layers (e.g., custom attention\
  \ modules) may need ad hoc “layer_collection” wiring.[5](https://supercomputersfordl2017.github.io/Presentations/K-FAC.pdf)[6](https://github.com/tensorflow/kfac/blob/master/docs/index.md)\n\
  \n***\n\n### 4. `DeepakTatachar/Privacy-Memorization-Curvature` (Input‑loss‑curvature\
  \ + memorization)  \n- **Name:** `Privacy‑Memorization‑Curvature`  \n- **URL:**\
  \ https://github.com/DeepakTatachar/Privacy-Memorization-Curvature[9](https://github.com/DeepakTatachar/Privacy-Memorization-Curvature)\n\
  - **Stars:** ~0.5k–1k  \n- **Key architectural decisions (state‑of‑the‑art):** \
  \ \n  - Implements input‑wise loss‑curvature analysis and explicitly links curvature\
  \ to memorization and privacy risk, which is a close conceptual sibling to K‑FAC‑based\
  \ memorization‑mitigation.[9](https://github.com/DeepakTatachar/Privacy-Memorization-Curvature)\n\
  \  - Builds on top of standard optimizers but records per‑sample curvature statistics,\
  \ enabling identification of “high‑memory” vs “generalization” examples using curvature‑like\
  \ signals.[9](https://github.com/DeepakTatachar/Privacy-Memorization-Curvature)\n\
  \  - Modular enough that the curvature‑computation core can be reused for small\
  \ LMs or dense MLPs, even if the original examples are image‑centric.[9](https://github.com/DeepakTatachar/Privacy-Memorization-Curvature)\n\
  - **Anti‑patterns / technical debt:**  \n  - Does not provide a full K‑FAC‑style\
  \ weight‑editing pipeline; you must implement the actual pruning/editing logic yourself.[9](https://github.com/DeepakTatachar/Privacy-Memorization-Curvature)\n\
  \  - Some experiments are tied to older benchmark datasets; reproducing on modern\
  \ LLMs may require rewriting data‑loading and model‑wrapping.[9](https://github.com/DeepakTatachar/Privacy-Memorization-Curvature)\n\
  \n***\n\n### 5. `alecwangcq/KFAC-Pytorch` (PyTorch K‑FAC + E‑KFAC)  \n- **Name:**\
  \ `KFAC‑Pytorch`  \n- **URL:** https://github.com/alecwangcq/KFAC-Pytorch[10](https://github.com/alecwangcq/KFAC-Pytorch)\n\
  - **Stars:** ~1k–1.5k  \n- **Key architectural decisions (state‑of‑the‑art):** \
  \ \n  - Straightforward PyTorch implementation of K‑FAC (and E‑KFAC variants) with\
  \ support for MLPs and CNNs, making it easy to plug into small‑scale LMs or SLMs.[10](https://github.com/alecwangcq/KFAC-Pytorch)\n\
  \  - Pre‑tunes good hyperparameter ranges (learning rate, damping, weight decay)\
  \ for K‑FAC, which helps stabilize curvature‑based procedures that are sensitive\
  \ to these settings.[10](https://github.com/alecwangcq/KFAC-Pytorch)\n  - Single‑GPU‑focused,\
  \ which simplifies debugging curvature‑estimation code and makes it suitable for\
  \ small‑scale memorization experiments.[10](https://github.com/alecwangcq/KFAC-Pytorch)\n\
  - **Anti‑patterns / technical debt:**  \n  - Multi‑GPU/TPU support is not built‑in;\
  \ scaling to large LLMs requires significant refactoring.[10](https://github.com/alecwangcq/KFAC-Pytorch)\n\
  \  - Geometry of K‑FAC‑style blocks is hard‑coded for “standard” MLP/conv patterns;\
  \ modifying it for transformer‑style layers (e.g., attention projections) is not\
  \ trivial.[11](https://arxiv.org/abs/2311.00636)[10](https://github.com/alecwangcq/KFAC-Pytorch)\n\
  \n***\n\n### 6. `omrifahn/kfac‑memorization‑code` (K‑FAC‑based weight editing for\
  \ memorization)  \n- **Name:** `omrifahn/kfac‑memorization‑code` (Hugging Face datasets\
  \ / small repo)  \n- **URL:** https://huggingface.co/datasets/omrifahn/kfac-memorization-code[12](https://huggingface.co/datasets/omrifahn/kfac-memorization-code)\n\
  - **Stars:** Dataset‑style repo; GitHub mirroring may have low stars, but the underlying\
  \ K‑FAC‑based memorization‑editing code is actively referenced.[12](https://huggingface.co/datasets/omrifahn/kfac-memorization-code)\n\
  - **Key architectural decisions (state‑of‑the‑art):**  \n  - Implements K‑FAC‑based\
  \ weight editing where low‑curvature directions (via Fisher ≈ K‑FAC) are associated\
  \ with memorization, and those directions are zeroed out while preserving high‑curvature\
  \ directions linked to generalization.[1](https://arxiv.org/html/2510.24256v2)[12](https://huggingface.co/datasets/omrifahn/kfac-memorization-code)\n\
  \  - Uses activation/gradient covariance blocks per MLP weight matrix to approximate\
  \ the FIM, then orders eigenmodes by curvature mass and prunes the bottom percentile,\
  \ which is the core idea of the “From Memorization to Reasoning…” paper.[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)[1](https://arxiv.org/html/2510.24256v2)\n\
  \  - Designed for language models, so it already includes text‑task evaluation pipelines\
  \ to measure memorization vs. generalization trade‑offs.[1](https://arxiv.org/html/2510.24256v2)\n\
  - **Anti‑patterns / technical debt:**  \n  - Often distributed as a complementary\
  \ dataset / code stub; some integration with a full model training stack is left\
  \ to the user.[12](https://huggingface.co/datasets/omrifahn/kfac-memorization-code)\n\
  \  - May not support modern LLM backbones out‑of‑the‑box; you may need to adapt\
  \ layer‑wrapping logic for new families (e.g., OLMo, LLaMA‑style).[2](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)[1](https://arxiv.org/html/2510.24256v2)\n\
  \n***\n\nIf you want, I can narrow this down to just repos that explicitly:  \n\
  - implement K‑FAC‑style curvature **and**  \n- perform **weight editing / pruning\
  \ specifically for memorization** in SLMs,  \n\nand then give you a concise table\
  \ comparing them (framework, language, K‑FAC‑style decisions, and anti‑patterns).\
  \ Which part would be most useful for your current SLM‑memorization project: pure\
  \ K‑FAC curvatura infrastructure, or ready‑made unlearning‑with‑curvature pipelines?"
raw_compute_text: '**Typical experiments using K-FAC loss curvature for memorization
  mitigation in SLMs, like those in "From Memorization to Reasoning in the Spectrum
  of Loss Curvature," involve collecting statistics on models such as OLMo-2 1B or
  7B.**[1](https://arxiv.org/abs/2510.24256)


  ## GPU Memory Needs

  These experiments require modest GPU memory since they focus on forward/backward
  passes over ~20M tokens (sequence length 512) without full fine-tuning.[2](https://huggingface.co/datasets/omrifahn/kfac-memorization-code)

  Associated code runs on Google Colab, implying under 16 GB VRAM fits standard setups.[2](https://huggingface.co/datasets/omrifahn/kfac-memorization-code)

  For OLMo-2 1B inference and K-FAC collection, expect 8-12 GB; scale to ~30-40 GB
  for 7B.[3](https://arxiv.org/html/2510.24256v2)


  ## Training Time

  K-FAC statistic collection takes ~2 hours on an A100 GPU for ~20M tokens.[2](https://huggingface.co/datasets/omrifahn/kfac-memorization-code)

  Mining memorized sequences adds ~1 hour, and experiments ~2 hours on A100.[2](https://huggingface.co/datasets/omrifahn/kfac-memorization-code)

  Total: 4-6 hours per full run, or 240-360 minutes.


  ## Common GPUs

  A100 is most commonly used in recent papers and reproductions for these experiments.[4](https://www.themoonlight.io/fr/review/from-memorization-to-reasoning-in-the-spectrum-of-loss-curvature)[2](https://huggingface.co/datasets/omrifahn/kfac-memorization-code)

  No mentions of T4, H100, or others specifically; A100 suits the ~20M token scale.[1](https://arxiv.org/abs/2510.24256)


  ## Colab T4 Feasibility

  Yes, feasible on free Google Colab T4 (16 GB VRAM, ~30 hours/week limit).[5](https://www.linkedin.com/pulse/gpu-acceleration-showdown-kaggle-vs-google-colab-machine-jha-vlvpe)[2](https://huggingface.co/datasets/omrifahn/kfac-memorization-code)

  Notebooks are explicitly Colab-designed; T4 handles OLMo-2 1B collection/inference,
  though slower than A100 (potentially 4-8x longer).[6](https://haikel-fazzani.deno.dev/blog/l40s-vs-a100-vs-h100-vs-t4-gpu)[2](https://huggingface.co/datasets/omrifahn/kfac-memorization-code)

  For 7B, Pro tier (A100/V100) recommended to avoid OOM.[5](https://www.linkedin.com/pulse/gpu-acceleration-showdown-kaggle-vs-google-colab-machine-jha-vlvpe)'
