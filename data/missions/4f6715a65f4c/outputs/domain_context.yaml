- description: '**The paper "From Memorization to Reasoning in the Spectrum of Loss
    Curvature" (arXiv:2510.24256) uses K-FAC to approximate loss curvature via activation
    (A) and gradient (G) covariances for decomposing MLP weights in transformers like
    OLMo-2 and ViTs, enabling memorization disentanglement and editing by retaining
    high-curvature components.**[1](https://arxiv.org/abs/2510.24256)'
