raw_sota_papers_text: 'No direct replications of the paper "From Memorization to Reasoning
  in the Spectrum of Loss Curvature" (arXiv:2510.24256) from 2024-2026 were identified
  in searches across arXiv, Google Scholar, and conference listings like NeurIPS/ICLR.[1](https://arxiv.org/abs/2510.24256)[2](https://scholar.google.com/citations?user=8xcIVC0AAAAJ&hl=en)[3](https://scholar.google.com/citations?user=msRx3NwAAAAJ&hl=en)


  The original 2025 paper by Merullo et al. explores loss curvature in transformers
  to disentangle memorization from reasoning, using K-FAC approximations for weight
  decomposition and editing to suppress memorized content while preserving general
  capabilities.[4](https://arxiv.org/html/2510.24256v1)[1](https://arxiv.org/abs/2510.24256)


  It has limited citations so far (0-5 noted in profiles), with no explicit replication
  studies at a similar venue level (arXiv preprint quality). Related works on loss
  curvature exist but predate or diverge from replication.[2](https://scholar.google.com/citations?user=8xcIVC0AAAAJ&hl=en)[3](https://scholar.google.com/citations?user=msRx3NwAAAAJ&hl=en)


  ## Related Papers on Loss Curvature


  These influential papers from 2024-2026 build on or parallel curvature-based memorization
  analysis but are not replications.


  | Title | Authors | Year | Key Technical Finding | Main Mathematical Contribution
  |

  |-------|---------|------|-----------------------|-------------------------------|

  | Memorization Through the Lens of Curvature of Loss Function Around Samples | Isha
  Garg, Deepak Ravikumar, Kaushik Roy | 2024 | Curvature averaged over epochs measures
  memorization; high-curvature samples are long-tailed or mislabeled. [5](https://proceedings.mlr.press/v235/garg24a.html)
  | Uses per-sample Hessian curvature $$\lambda_i = \trace(H(x_i, y_i))$$ as memorization
  proxy, linking to generalization gaps. [5](https://proceedings.mlr.press/v235/garg24a.html)[6](https://arxiv.org/abs/2307.05831)
  |

  | Scalable Loss Curvature in LLM Training (critical sharpness) | (Not specified
  in results) | 2025 | Critical sharpness tracks curvature dynamics scalably with
  5-6 forward passes, aiding data mixing. [7](https://www.emergentmind.com/papers/2601.16979)
  | Relative critical sharpness: $$\eta_c = \max_\alpha \{ \eta \mid L(\theta - \alpha
  \nabla L) < L(\theta) \}$$, proxy for Hessian eigenvalues without full computation.
  [7](https://www.emergentmind.com/papers/2601.16979) |


  ## Why Few Replications?


  The paper is recent (Oct 2025), limiting time for high-citation replications by
  March 2026. Searches found discussions/reviews but no targeted "replicación" or
  follow-ups matching the query.[8](https://www.goodfire.ai/research/understanding-memorization-via-loss-curvature)[9](https://huggingface.co/papers/2510.24256)[1](https://arxiv.org/abs/2510.24256)


