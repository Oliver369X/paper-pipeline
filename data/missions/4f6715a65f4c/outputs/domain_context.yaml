  \ (e.g., no activation ratio divergence between memorized/clean data as in Fig.\
  \ 2).[1](https://arxiv.org/abs/2510.24256)\n**Root cause:** Failing to exclude the\
  \ last position in forward activations or normalize by position count during streaming,\
  \ causing edge effects in next-token prediction losses.  \n**Fix:** Buffer pre-activation\
  \ inputs excluding last token; accumulate x^T x / num_positions and g^T g / num_positions.\
  \ Verified in repo's collection script.\n\n### Eigenvalue Instability in Decomposition\n\
  **Symptom:** NaN or inf in C = U_G^T W U_A, or erratic editing (e.g., validation\
  \ accuracy drops >10% post-60% ρ).[2](https://junwei-lu.github.io/bst236/chapter_neural_networks/pitfall/)[1](https://arxiv.org/abs/2510.24256)\n\
  **Root cause:** Small eigenvalues near zero in eigendecomp of ill-conditioned G\
  \ ⊗ A (common in K-FAC; see gpauloski/kfac-pytorch issues).[3](https://github.com/n-gao/pytorch-kfac)[4](https://coder.social/gpauloski/kfac-pytorch)\n\
  **Fix:** Add damping (e.g., 1e-6 * trace(G)) to eigenvalues before decomposition,\
  \ as in original K-FAC (Martens & Grosse, 2015). Paper implies via stable results;\
  \ PyTorch pitfalls confirm.[2](https://junwei-lu.github.io/bst236/chapter_neural_networks/pitfall/)\n\
  \n### Wrong Pair Selection for Editing\n**Symptom:** Poor memorization suppression\
  \ (strict acc >20% on quotes vs. paper's 16.1%) or perplexity explosion (>25).[1](https://arxiv.org/abs/2510.24256)\n\
