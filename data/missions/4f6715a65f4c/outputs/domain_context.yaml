    (~20M tokens), eigendecompositions, and pair-wise truncation based on curvature
    mass Π_ij = λ_i μ_j.**'
  source_paper: ''
  symptom: ''
  fix: ''
- description: "### Incorrect Covariance Accumulation\n**Symptom:** Biased A or G\
    \ matrices lead to poor disentanglement (e.g., no activation ratio divergence\
    \ between memorized/clean data as in Fig. 2).[1](https://arxiv.org/abs/2510.24256)\n\
    **Root cause:** Failing to exclude the last position in forward activations or\
    \ normalize by position count during streaming, causing edge effects in next-token\
    \ prediction losses.  \n**Fix:** Buffer pre-activation inputs excluding last token;\
    \ accumulate x^T x / num_positions and g^T g / num_positions. Verified in repo's\
    \ collection script."
  source_paper: ''
  symptom: '** Biased A or G matrices lead to poor disentanglement (e'
  fix: '** Buffer pre-activation inputs excluding last token; accumulate x^T x / num_positions
    and g^T g / num_positions'
- description: '### Eigenvalue Instability in Decomposition

    **Symptom:** NaN or inf in C = U_G^T W U_A, or erratic editing (e.g., validation
    accuracy drops >10% post-60% ρ).[2](https://junwei-lu.github.io/bst236/chapter_neural_networks/pitfall/)[1](https://arxiv.org/abs/2510.24256)

    **Root cause:** Small eigenvalues near zero in eigendecomp of ill-conditioned
    G ⊗ A (common in K-FAC; see gpauloski/kfac-pytorch issues).[3](https://github.com/n-gao/pytorch-kfac)[4](https://coder.social/gpauloski/kfac-pytorch)

    **Fix:** Add damping (e.g., 1e-6 * trace(G)) to eigenvalues before decomposition,
    as in original K-FAC (Martens & Grosse, 2015). Paper implies via stable results;
    PyTorch pitfalls confirm.[2](https://junwei-lu.github.io/bst236/chapter_neural_networks/pitfall/)'
  source_paper: Martens & Grosse, 2015
  symptom: '** NaN or inf in C = U_G^T W U_A, or erratic editing (e'
  fix: '** Add damping (e'
- description: "### Wrong Pair Selection for Editing\n**Symptom:** Poor memorization\
    \ suppression (strict acc >20% on quotes vs. paper's 16.1%) or perplexity explosion\
    \ (>25).[1](https://arxiv.org/abs/2510.24256)\n**Root cause:** Sorting pairs by\
    \ λ_i or μ_j individually instead of Π_ij = λ_i μ_j, missing cumulative ρ M_tot\
    \ threshold.  \n**Fix:** Greedily select top Π_ij pairs until sum(Π_S) >= ρ *\
    \ (sum(λ) * sum(μ)); apply M ⊙ C. Directly from method section; repo implements\
    \ this."
  source_paper: ''
  symptom: '** Poor memorization suppression (strict acc >20% on quotes vs'
  fix: '** Greedily select top Π_ij pairs until sum(Π_S) >= ρ * (sum(λ) * sum(μ));
    apply M ⊙ C'
- description: '### Device/Graph Detach Mismatches

    **Symptom:** RuntimeError on backward() during stat collection, or detached gradients
    yielding zero-curvature basis.[5](https://www.learnpytorch.io/pytorch_most_common_errors/)[2](https://junwei-lu.github.io/bst236/chapter_neural_networks/pitfall/)

    **Root cause:** Activations/grads on mixed devices (CPU/GPU) or .detach()/numpy()
    breaking compute graph in large ~20M token passes.[5](https://www.learnpytorch.io/pytorch_most_common_errors/)

    **Fix:** Use .cuda() consistently; retain_grad() on hooks without detach. Standard
    PyTorch K-FAC practice (n-gao/pytorch-kfac).[3](https://github.com/n-gao/pytorch-kfac)[2](https://junwei-lu.github.io/bst236/chapter_neural_networks/pitfall/)'
  source_paper: ''
  symptom: '** RuntimeError on backward() during stat collection, or detached gradients
    yielding zero-curvature basis'
  fix: '** Use'
- description: "### Layer/Projection Misspecification\n**Symptom:** Edits fail to\
    \ suppress untargeted data (e.g., Dolma strict >5% vs. 3.4%), no ViT GT recovery\
    \ boost.[1](https://arxiv.org/abs/2510.24256)\n**Root cause:** Editing wrong MLPs\
    \ (e.g., all layers vs. paper's LM layers 23-25 up/gate @60%ρ, ViT 0/11 @75%).\
    \  \n**Fix:** Sweep/hardcode per model: OLMo-7B late MLPs, ViT early/late. Ablation\
    \ in paper confirms; repo has utils.[1](https://arxiv.org/abs/2510.24256)"
  source_paper: ''
  symptom: '** Edits fail to suppress untargeted data (e'
  fix: '** Sweep/hardcode per model: OLMo-7B late MLPs, ViT early/late'
