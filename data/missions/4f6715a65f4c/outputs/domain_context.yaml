  \ like OLMo-2 and ViTs, enabling memorization disentanglement and editing by retaining\
  \ high-curvature components.**[1](https://arxiv.org/abs/2510.24256)\n\n**Its official\
  \ GitHub repo provides PyTorch code for collecting statistics (~20M tokens), eigendecompositions,\
  \ and pair-wise truncation based on curvature mass Π_ij = λ_i μ_j.**\n\n### Incorrect\
